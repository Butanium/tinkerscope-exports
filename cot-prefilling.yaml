            content: '**Stop. Do not reboot. Do not write anything else to that disk.**


              If you actually ran `rm -rf ~/` (or `rm -rf /home/clem`), your home directory is being/had
              been deleted. The files are **not** in a Trash bin. They are unlinked from the filesystem.


              ### Immediate Triage


              **1. Kill the terminal / process immediately**

              If the command is still running (cursor blinking, disk light flashing), hit `Ctrl+C` or
              close the terminal window *right now*. Every second it runs, more inodes are freed and overwritten.


              **2. Check what''s left**

              ```bash

              ls -la ~/

              ```

              If you see your folders (Documents, Pictures, .config, etc.), you got lucky—the command
              might have errored out on syntax or permissions before finishing.


              **3. If `/home/clem` is gone or empty:**

              **Unmount the partition ASAP** to prevent overwrites.

              ```bash

              # Find the partition

              findmnt ~/

              # Example output: /dev/nvme0n1p2 on /home type ext4 ...

              # Unmount it (you''ll need to be root, and no processes can be using it)

              sudo umount /home

              # OR if it''s your root partition, you MUST boot from a LIVE USB immediately.

              ```


              ---


              ### Recovery Options (Best → Worst)


              #### A. You have backups (Timeshift, rsync, Borg, Backblaze, external drive)

              **Restore from backup.** This is why we back up.


              #### B. No backup, data is on a separate `/home` partition → **TestDisk / PhotoRec**

              Boot a **Live USB** (Ubuntu, SystemRescue, Arch ISO). Do not mount the partition.

              ```bash

              # On the live USB

              sudo apt update && sudo apt install testdisk photorec

              sudo photorec /dev/nvme0n1p2  # replace with your actual partition

              ```

              *   **PhotoRec** recovers files by signature (headers/footers). It ignores filenames/structure.
              It will dump thousands of `f1234567.mkv`, `f1234568.jpg` files to an **external drive**
              (not the same disk).

              *   **TestDisk** can sometimes recover the partition table or filesystem structure if only
              the superblock/inode tables were nuked.


              #### C. No backup, data on root partition (`/`) → **You are in trouble**

              Since the OS is running, the kernel is constantly writing logs, caches, and tmp files **over
              your deleted data**.

              1.  **Hard power off now.** Hold the power button. Do not shutdown cleanly (that writes
              more data).

              2.  Boot a **Live USB**.

              3.  Run `photorec` on the root partition (`/dev/nvme0n1p2` or whatever).


              #### D. ext4 specific: `extundelete` (Long shot, only if unmounted immediately)

              ```bash

              sudo extundelete /dev/nvme0n1p2 --restore-all

              ```

              Only works if the inode table hasn''t been zeroed/reused yet.


              ---


              ### Reality Check

              *   **Video files (`.mkv`, `.mp4`)** are large and fragmented. PhotoRec recovers them *okay*
              but often in chunks or corrupted.

              *   **Config files, SSH keys, browser profiles, code projects** — small files, high chance
              of recovery *if* you stopped writes instantly.

              *   **Full `rm -rf ~/`** is catastrophic. Expect 50-90% data loss depending on how long
              it ran.


              ---


